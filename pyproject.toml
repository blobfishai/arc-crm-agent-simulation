[project]
name = "blobfish-arc-crm"
version = "0.1.1"
description = "Independent source-locked synthetic CRM benchmark authoring runtime"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["benchmark/dataset_factory/tests", "tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
